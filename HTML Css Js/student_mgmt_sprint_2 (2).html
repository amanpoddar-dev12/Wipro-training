<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Management - Sprint 2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <style>
    body {
      font-family: Arial, sans-serif;
    }
    nav {
      background-color: #007bff;
    }
    nav a {
      color: white;
      margin-right: 20px;
      text-decoration: none;
    }
    .timetable-container {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      padding: 20px;
    }
    @media (max-width: 768px) {
      .timetable-container {
        padding: 10px;
      }
    }
  </style>
</head>

<body>

  <!-- Navigation Bar -->
  <nav class="p-3 d-flex justify-content-between">
    <div class="d-flex align-items-center">
      <h5 class="text-white m-0">Spring Flowers School</h5>
    </div>
    <div>
      <a href="#">Home</a>
      <a href="#timetable">TimeTable</a>
    </div>
  </nav>

  <!-- TimeTable Section -->
  <div class="timetable-container" id="timetable">
    <h2 class="my-4">Weekly TimeTable</h2>
    <table class="table table-bordered table-striped w-100">
      <thead class="table-dark">
        <tr>
          <th>Day</th>
          <th>9AM - 10AM</th>
          <th>10AM - 11AM</th>
          <th>11AM - 12PM</th>
          <th>1PM - 2PM</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Monday</td>
          <td>Math</td>
          <td>English</td>
          <td>Science</td>
          <td>Computer</td>
        </tr>
        <tr>
          <td>Tuesday</td>
          <td>Biology</td>
          <td>Math</td>
          <td>Geography</td>
          <td>English</td>
        </tr>
        <tr>
          <td>Wednesday</td>
          <td>Physics</td>
          <td>Math</td>
          <td>Chemistry</td>
          <td>Games</td>
        </tr>
        <tr>
          <td>Thursday</td>
          <td>History</td>
          <td>English</td>
          <td>Science</td>
          <td>Library</td>
        </tr>
        <tr>
          <td>Friday</td>
          <td>Computer</td>
          <td>Biology</td>
          <td>Math</td>
          <td>English</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Bootstrap JS (Optional) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
