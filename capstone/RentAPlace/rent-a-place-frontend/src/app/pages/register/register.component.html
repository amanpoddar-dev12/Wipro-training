<div class="container d-flex justify-content-center align-items-center min-vh-100">
  <div class="card shadow-lg border-0 rounded-4 p-4 col-md-6 col-lg-5">
    <h2 class="text-center fw-bold mb-4 text-dark">Create Account</h2>
    <form (ngSubmit)="register()">
      <div class="mb-3">
        <label class="form-label fw-semibold">Name</label>
        <input type="text" [(ngModel)]="name" name="name" class="form-control rounded-pill px-3" placeholder="Enter your name" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Email</label>
        <input type="email" [(ngModel)]="email" name="email" class="form-control rounded-pill px-3" placeholder="Enter your email" required>
      </div>
      <div class="mb-3">
        <label class="form-label fw-semibold">Password</label>
        <input type="password" [(ngModel)]="password" name="password" class="form-control rounded-pill px-3" placeholder="Enter your password" required>
      </div>
      <div class="mb-4">
        <label class="form-label fw-semibold">Role</label>
        <select [(ngModel)]="role" name="role" class="form-select rounded-pill px-3">
          <option>User</option>
          <option>Owner</option>
        </select>
      </div>
      <button class="btn btn-primary w-100 rounded-pill py-2 fw-semibold">Register</button>
    </form>
    <p class="text-center mt-3 text-muted">Already have an account? 
     <a class="btn btn-link text-decoration-none fw-semibold" (click)="goToLogin()">
  Login
</a>
    </p>
  </div>
</div>

<style>
  .form-control:focus, 
  .form-select:focus {
   border-color: #0d6efd;
    box-shadow: 0 0 0 .2rem rgba(13,110,253,.25);
  }
</style>
